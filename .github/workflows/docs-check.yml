name: Documentation

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-check:
    name: Liens et guide de rédaction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      # Le script de vérification vit dans le repo frontend, les deux autres repos servent à vérifier les liens entre repos
      - name: Clone des autres repos StockHub
        env:
          CHECK_DOCS_REF: beedffc8726d7ee225b7cf452ea7578a0ab27403 # front #333
        run: |
          mkdir -p "$RUNNER_TEMP/siblings"
          # Version épinglée du script : une évolution de check-docs côté frontend ne s'applique ici qu'en mettant à jour CHECK_DOCS_REF (SHA complet, tag ou branche)
          git init -q "$RUNNER_TEMP/siblings/stockHub_V2_front"
          git -C "$RUNNER_TEMP/siblings/stockHub_V2_front" fetch -q --depth 1 https://github.com/SandrineCipolla/stockHub_V2_front.git "$CHECK_DOCS_REF"
          git -C "$RUNNER_TEMP/siblings/stockHub_V2_front" checkout -q FETCH_HEAD
          git clone --depth 1 https://github.com/SandrineCipolla/stockhub_design_system.git "$RUNNER_TEMP/siblings/stockhub_design_system"

      - name: Vérification de la documentation
        run: node "$RUNNER_TEMP/siblings/stockHub_V2_front/scripts/check-docs.mjs"
        env:
          DOCS_SIBLINGS_DIR: ${{ runner.temp }}/siblings
